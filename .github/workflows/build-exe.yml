name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, ex. v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name Anonymiseur clip_anon.py

      - uses: actions/upload-artifact@v4
        with:
          name: Anonymiseur-windows
          path: dist/Anonymiseur.exe

      - name: Publish release with exe
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        shell: bash
        run: |
          gh release create "$VERSION" dist/Anonymiseur.exe \
            --target "$GITHUB_SHA" --title "Anonymiseur $VERSION" --generate-notes
