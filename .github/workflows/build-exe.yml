# Teste le moteur, compile IA-Anonymiser.exe sur Windows, puis publie une release
# quand un tag "v*" est poussé ou quand le workflow est lancé à la main avec un numéro de version.

name: Construction et release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v1.1.0) ; vide = simple construction"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests du moteur
        run: python -m unittest discover -s tests -v

      - name: Compiler l'exe
        shell: bash
        run: |
          echo "VERSION = \"${VERSION:-dev-${GITHUB_SHA::7}}\"" > version.py
          pip install pyinstaller sv-ttk
          pyinstaller --onefile --windowed --name IA-Anonymiser --icon assets/icone.ico \
            --add-data "assets;assets" --collect-data sv_ttk anonymiseur.py
          cd dist
          # Comme PhishGuard : un exe avec le numéro de version, et le même sans numéro pour le lien
          # permanent …/releases/latest/download/IA-Anonymiser.exe
          if [ -n "$VERSION" ]; then cp IA-Anonymiser.exe "IA-Anonymiser-$VERSION.exe"; fi
          sha256sum IA-Anonymiser*.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: IA-Anonymiser
          path: dist/*

      - name: Publier la release
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          fichiers=(dist/IA-Anonymiser.exe "dist/IA-Anonymiser-$VERSION.exe" dist/SHA256SUMS.txt)
          if gh release view "$VERSION" > /dev/null 2>&1; then
            # Release déjà publiée : ses fichiers sont remplacés
            gh release upload "$VERSION" "${fichiers[@]}" --clobber
          else
            gh release create "$VERSION" "${fichiers[@]}" \
              --target "$GITHUB_SHA" --title "IA-Anonymiser $VERSION" --generate-notes
          fi
